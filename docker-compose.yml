services:
  scrapbook-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${APP_PORT}
        - BASE_URL=${APP_URL}
        - DEFAULT_PAG. ES=${APP_SCRAP_PAGES}
        - OUTPUT_FILE=${APP_SCRAP_OUTPUT_FILE}
        - PUPPETEER_HEADLESS=${PUPPETEER_HEADLESS}
    container_name: scrapbook-api
    env_file:
      - .env
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      # Sincroniza books.json generado en el contenedor con tu máquina local
      - ./books.json:/usr/src/app/books.json
    environment:
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    # Aumenta la memoria compartida para evitar que Chromium crashee al abrir varias pestañas
    shm_size: '1gb'
    restart: unless-stopped