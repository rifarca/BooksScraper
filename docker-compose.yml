services:
  scrpbook-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrpbook-api
    ports:
      - "3000:3000"
    volumes:
      # Sincroniza books.json generado en el contenedor con tu máquina local
      - ./books.json:/usr/src/app/books.json
    environment:
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    # Aumenta la memoria compartida para evitar que Chromium crashee al abrir varias pestañas
    shm_size: '1gb'
    restart: unless-stopped